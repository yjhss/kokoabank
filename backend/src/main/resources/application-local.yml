spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kokoabank}
    username: ${DB_USERNAME:kokoa}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      
logging:
  level:
    root: INFO
    com.kokoabank: DEBUG

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
