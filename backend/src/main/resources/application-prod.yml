spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

logging:
  level:
    root: INFO
    com.kokoabank: INFO

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
